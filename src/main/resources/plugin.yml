name: TeamGlow
main: com.xyron.teamglow.TeamGlow
version: 1.0.0
api-version: '1.20'
depend: [ProtocolLib]
commands:
  team:
    description: TeamGlow team manager
    aliases: [tg]
    usage: /team <create|add|remove|delete|clear|fight|glow|list>
permissions:
  teamglow.admin:
    default: op
  teamglow.view:
    default: true
